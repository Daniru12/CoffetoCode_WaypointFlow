name: Auto Merge Stage to Main

on:
  push:
    branches:
      - Stage

# CRITICAL: We need write permissions to push to main
permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Stage to Main and Push
        run: |
          # Set up git config for the bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch the main branch
          git fetch origin main:main
          
          # Checkout main branch
          git checkout main
          
          # Merge Stage into main without opening an editor
          git merge origin/Stage --no-edit
          
          # Push the updated main branch back to the repository
          git push origin main
