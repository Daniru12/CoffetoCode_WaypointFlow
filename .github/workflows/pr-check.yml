name: PR Check (Dev to Stage)

on:
  pull_request:
    branches:
      - Stage

jobs:
  check-build:
    runs-on: ubuntu-latest
    
    # Optional: explicitly state read permission
    permissions:
      contents: read
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --passWithNoTests
